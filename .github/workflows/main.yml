name: Сборка Yozora

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack zip
        run: unzip -q yozora_v1.4.zip -d unpacked

      - name: Find project root
        id: root
        run: |
          ROOT=$(find unpacked -name gradlew -type f | head -1 | xargs dirname)
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Проект найден в: $ROOT"
          ls "$ROOT"

      - name: Build
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: yozora-client
          path: unpacked/**/build/libs/*.jar
          if-no-files-found: error

