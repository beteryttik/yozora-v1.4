name: Сборка Yozora

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack zip
        run: unzip -q yozora_v1.4.zip -d unpacked

      - name: Fix gradle wrapper and settings
        run: |
          ROOT=$(find unpacked -name gradlew -type f | head -1 | xargs dirname)
          echo "Проект: $ROOT"
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip|' "$ROOT/gradle/wrapper/gradle-wrapper.properties"
          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'yozora'
          EOF
          echo "settings.gradle создан"

      - name: Build
        working-directory: ${{ format('{0}', '') }}
        run: |
          ROOT=$(find unpacked -name gradlew -type f | head -1 | xargs dirname)
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: yozora-client
          path: unpacked/**/build/libs/*.jar
          if-no-files-found: error
